name: Deploy to Cloudflare Pages

# Deploy the static site in "Final Version/" (plus its Pages Functions) to the
# existing Cloudflare Pages project (iceland-2026). Keeps the same URL:
# https://iceland-2026-c5w.pages.dev
#
# The expense tracker (/api/expenses) needs a KV namespace bound as EXPENSES.
# This workflow ensures the namespace exists and appends the binding to
# wrangler.toml before deploying. If KV can't be set up (e.g. token lacks the
# permission) the deploy still succeeds and the app falls back to localStorage.
#
# One-time setup: repo secret CLOUDFLARE_API_TOKEN (needs Pages: Edit and
# Workers KV Storage: Edit — the "Developer Services" token template covers both).

on:
  push:
    branches:
      - main
      - claude/iceland-2026-handoff-aqxr58
    paths:
      - 'Final Version/**'
      - 'functions/**'
      - 'wrangler.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 123ab630f5cbd404e46c60311212541c
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm i -D wrangler@4

      - name: Ensure KV namespace + binding
        run: |
          LIST=$(npx wrangler kv namespace list 2>/dev/null || echo '[]')
          ID=$(echo "$LIST" | jq -r '.[]? | select(.title|test("EXPENSES")) | .id' 2>/dev/null | head -n1)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Creating KV namespace EXPENSES…"
            OUT=$(npx wrangler kv namespace create EXPENSES 2>&1 || true)
            echo "$OUT"
            ID=$(echo "$OUT" | grep -oiE '[0-9a-f]{32}' | head -n1)
          fi
          if [ -n "$ID" ] && [ "$ID" != "null" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "EXPENSES"\nid = "%s"\n' "$ID" >> wrangler.toml
            echo "✅ Bound EXPENSES → $ID"
          else
            echo "⚠️ Could not resolve KV id; deploying without KV (app uses localStorage)."
          fi
          echo "----- wrangler.toml -----"
          cat wrangler.toml

      - name: Deploy
        run: npx wrangler pages deploy --project-name=iceland-2026 --branch=main

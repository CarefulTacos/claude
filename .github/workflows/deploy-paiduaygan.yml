name: Deploy Pai Duay Gan site

# Deploys pai-duay-gan/site (static pages + Pages Functions + D1) to the
# Cloudflare Pages project "pai-duay-gan".
# Manual only (Actions tab -> Run workflow). The Run button appears once this
# file is on the default branch. One-time setup is in pai-duay-gan/site/DEPLOY.md.
# Uses the CLOUDFLARE_API_TOKEN secret (needs Pages:Edit and D1:Edit).

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: pai-duay-gan/site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 123ab630f5cbd404e46c60311212541c
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pai-duay-gan/site/package-lock.json

      - name: Install wrangler (pinned in package.json)
        run: npm ci

      - name: Check D1 database id is set
        run: |
          if grep -q REPLACE_WITH_D1_ID wrangler.toml; then
            echo "::error::ยังไม่ได้ใส่ database_id ใน pai-duay-gan/site/wrangler.toml (ดู DEPLOY.md ขั้นที่ 2)"
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Create Pages project if missing
        continue-on-error: true
        run: npx wrangler pages project create pai-duay-gan --production-branch=main

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pai-duay-gan --remote

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name=pai-duay-gan --branch=main
